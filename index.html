<!doctype html>
<html lang="fr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Portfolio d'Eliot Collomb, étudiant en Bachelor administration systèmes, réseaux et bases de données : projets, journal d'avancement, compétences et contact."
    />
    <title>Eliot Collomb · Systèmes, réseaux &amp; Cloud/DevOps</title>
    <script>
      // Thème avant le premier rendu : choix enregistré, sinon préférence système
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
